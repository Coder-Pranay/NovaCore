spring:
  application:
    name: novacore-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${NOVACORE_STORAGE_MAX_FILE_SIZE:50MB}
      max-request-size: ${NOVACORE_STORAGE_MAX_FILE_SIZE:50MB}
  mail:
    host: ${NOVACORE_MAIL_HOST:localhost}
    port: ${NOVACORE_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: ${NOVACORE_MAIL_HEALTH_ENABLED:false}

novacore:
  app:
    name: NovaCore
    version: 0.1.0
  public-share:
    base-url: ${NOVACORE_PUBLIC_SHARE_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${NOVACORE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    require-email-verification: ${NOVACORE_REQUIRE_EMAIL_VERIFICATION:false}
    password-reset-token-expiration: ${NOVACORE_PASSWORD_RESET_TOKEN_EXPIRATION:30m}
    email-verification-token-expiration: ${NOVACORE_EMAIL_VERIFICATION_TOKEN_EXPIRATION:24h}
    resend-verification-cooldown: ${NOVACORE_RESEND_VERIFICATION_COOLDOWN:60s}
    frontend-base-url: ${NOVACORE_FRONTEND_BASE_URL:http://localhost:3000}
    mail-from: ${NOVACORE_MAIL_FROM:noreply@novacore.local}
    cookie:
      access-name: novacore_access
      refresh-name: novacore_refresh
      session-name: novacore_session
      secure: ${NOVACORE_AUTH_COOKIE_SECURE:false}
      same-site: Lax
      access-path: /api
      refresh-path: /api/v1/auth
      session-path: /
  jwt:
    secret: ${NOVACORE_JWT_SECRET:novacore-dev-jwt-secret-key-change-me-32b}
    access-token-expiration: ${NOVACORE_JWT_ACCESS_EXPIRATION:15m}
    refresh-token-expiration: ${NOVACORE_JWT_REFRESH_EXPIRATION:7d}
    issuer: ${NOVACORE_JWT_ISSUER:novacore}
  storage:
    endpoint: ${NOVACORE_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${NOVACORE_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${NOVACORE_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${NOVACORE_STORAGE_BUCKET:novacore}
    region: ${NOVACORE_STORAGE_REGION:us-east-1}
    max-file-size: ${NOVACORE_STORAGE_MAX_FILE_SIZE:50MB}
    allowed-content-types: []
